<text x="42" y="811.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#17394b">Revision A | 13 Nov 2026 | Reference design - see release register and engineering specification</text>
<text x="1050" y="811.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#17394b">5 / 6</text>
