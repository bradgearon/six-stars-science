<rect x="70" y="590" width="300" height="105" fill="#edf3f5" stroke="#17394b"/>
<text x="84" y="615.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">Independent child A</text>
<text x="84" y="643.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Own learned capability; origin IDs survive</text>
<text x="84" y="662.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">forwarding</text>
<rect x="445" y="590" width="300" height="105" fill="#edf3f5" stroke="#17394b"/>
<text x="459" y="615.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">Relay child B</text>
<text x="459" y="643.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Later chain experiment; bounded hops and</text>
<text x="459" y="662.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">expiry</text>
<rect x="820" y="590" width="300" height="105" fill="#edf3f5" stroke="#17394b"/>
<text x="834" y="615.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">Core recipient</text>
<text x="834" y="643.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Reject duplicate ancestry; preserve</text>
<text x="834" y="662.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">uncertainty and dissent</text>
