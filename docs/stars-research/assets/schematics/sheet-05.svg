<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842">
<rect width="100%" height="100%" fill="white"/>
<text x="42" y="37.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#087e85">CE-ENG-001 / Sheet 05</text>
<text x="42" y="71.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17394b">Child engram spaces and directed Mesh chains</text>
<text x="42" y="96.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#a85418">Logical and biological state boundaries; affect-inspired weights are host-side proposals</text>
<line x1="42" y1="112" x2="1148" y2="112" stroke="#17394b" stroke-width="1.5"/>
<rect x="70" y="150" width="300" height="130" fill="#edf3f5" stroke="#17394b"/>
<text x="84" y="175.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">C - master task space</text>
<text x="84" y="203.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Retained context-sensitive capability.</text>
<text x="84" y="222.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Protected old relations. Local</text>
<text x="84" y="241.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">neuronal/astrocytic organization.</text>
<rect x="445" y="150" width="300" height="130" fill="#edf3f5" stroke="#17394b"/>
<text x="459" y="175.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">O - observation space</text>
<text x="459" y="203.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Independent curriculum, readout and</text>
<text x="459" y="222.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">history. O1 discrimination; O2 optional early</text>
<text x="459" y="241.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">warning.</text>
<rect x="820" y="150" width="300" height="130" fill="#edf3f5" stroke="#17394b"/>
<text x="834" y="175.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">S - support space</text>
<text x="834" y="203.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Independent policy task and history.</text>
<text x="834" y="222.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Proposes bounded actions; does not</text>
<text x="834" y="241.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">operate hardware directly.</text>
<rect x="445" y="365" width="300" height="150" fill="#edf3f5" stroke="#17394b"/>
<text x="459" y="390.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">Coordinator</text>
<text x="459" y="418.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Admit valid, fresh, relevant events.</text>
<text x="459" y="437.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Reliability/calibration weight answers.</text>
<text x="459" y="456.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Anxiety/anger indices prioritize review.</text>
