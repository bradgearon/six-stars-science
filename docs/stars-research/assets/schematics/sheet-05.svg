<text x="70" y="741.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Initial maximum hop count: 1. Test deeper chains in software first. No shared liquid in the initial design. Separation clears queued events and adaptive shared state</text>
<text x="70" y="760.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">before child-only testing.</text>
