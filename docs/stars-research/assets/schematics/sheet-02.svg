<text x="414" y="175.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">Observation registration</text>
<text x="414" y="203.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Fiducials, electrode map, cell identity</text>
<text x="414" y="222.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">and optical calibration</text>
<rect x="820" y="150" width="280" height="95" fill="#edf3f5" stroke="#17394b"/>
<text x="834" y="175.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">Identified supply</text>
<text x="834" y="203.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Selected complete medium; supported</text>
<text x="834" y="222.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">manual exchange first</text>
