<text x="834" y="560.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">Sample and waste</text>
<text x="834" y="588.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Parent identity, volume and time; no</text>
<text x="834" y="607.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">recipient cross-feed</text>
