<text x="84" y="620.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">Dry / culture / service separation</text>
<text x="84" y="648.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Carrier datums and cable strain relief outside the active surface. Independent liquids and</text>
<text x="84" y="667.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">waste identities. Calibrated local environmental observations.</text>
<text x="70" y="735.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">F01 is repeated per module. An axon-permissive physical bridge is a later build with measured diffusion, leakage and crosstalk; it is not drawn as fluidically perfect</text>
<text x="70" y="754.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">isolation.</text>
