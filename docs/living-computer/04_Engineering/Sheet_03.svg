<text x="72" y="705.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">U3: HW_OK = LOOP_OK AND RESET_N. U7: CLEAR_N = HW_OK AND MCU_READY. U4: PERMIT_RAW = LATCH_Q AND MCU_PERMIT. R8 connects</text>
<text x="72" y="724.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">PERMIT_RAW to J1 PERMIT_OUT; R9 holds the receiving test signal low.</text>
<text x="72" y="758.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17394b">USB powers U1. All local logic uses U1 3V3; no external feed into that output. C1-C6 bypass U2-U7 locally; C8 is bulk entry capacitance.</text>
