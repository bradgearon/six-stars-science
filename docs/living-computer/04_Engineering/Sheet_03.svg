<text x="660" y="360.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#17394b">R1 = 1.00k to ground selects nominal 200 ms. R2 = 100k pulls RESET_N</text>
<text x="660" y="378.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#17394b">high. U2 resets U1 and clears permission on missed DONE. Actual timing</text>
<text x="660" y="396.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#17394b">requires bench verification.</text>
