<text x="84" y="580.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">P - source service</text>
<text x="84" y="608.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Bank, production and maturation; outside</text>
<text x="84" y="627.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">the trained core</text>
<rect x="450" y="555" width="290" height="100" fill="#edf3f5" stroke="#17394b"/>
<text x="464" y="580.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">B - teaching recipient</text>
<text x="464" y="608.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Separate campaign; independent test</text>
<text x="464" y="627.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">after bridge removal</text>
<rect x="830" y="555" width="290" height="100" fill="#edf3f5" stroke="#17394b"/>
<text x="844" y="580.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">Culture support</text>
<text x="844" y="608.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Independent fluid paths; care continues</text>
<text x="844" y="627.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">on task pause</text>
