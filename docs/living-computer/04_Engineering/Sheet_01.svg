<rect width="100%" height="100%" fill="white"/>
<text x="42" y="37.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#087e85">CE-ENG-001 / Sheet 01</text>
<text x="42" y="71.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17394b">System interconnection and ownership</text>
<text x="42" y="96.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#a85418">System specification; vendor internal sensing/drive electronics remain commercial equipment</text>
<line x1="42" y1="112" x2="1148" y2="112" stroke="#17394b" stroke-width="1.5"/>
<rect x="70" y="145" width="290" height="115" fill="#edf3f5" stroke="#17394b"/>
<text x="84" y="170.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">C - primary learner</text>
<text x="84" y="198.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Human neuronal/astrocytic core; own</text>
<text x="84" y="217.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">chip, support and history</text>
<rect x="450" y="145" width="290" height="115" fill="#edf3f5" stroke="#17394b"/>
<text x="464" y="170.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">O - trained observer</text>
<text x="464" y="198.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Separate culture; encoded telemetry,</text>
<text x="464" y="217.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">prediction and abstention</text>
<rect x="830" y="145" width="290" height="115" fill="#edf3f5" stroke="#17394b"/>
<text x="844" y="170.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">S - support learner</text>
<text x="844" y="198.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Later separate culture; proposes bounded</text>
<text x="844" y="217.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">support actions</text>
<rect x="70" y="335" width="290" height="125" fill="#edf3f5" stroke="#17394b"/>
<text x="84" y="360.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">E - evaluator</text>
<text x="84" y="388.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Protected targets; feedback only after</text>
<text x="84" y="407.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">response closes; sealed confirmation</text>
<rect x="450" y="335" width="290" height="125" fill="#edf3f5" stroke="#17394b"/>
<text x="464" y="360.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">H - host and bridge</text>
<text x="464" y="388.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Vendor acquisition; encoding, fixed</text>
<text x="464" y="407.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">readout, event ancestry and logging</text>
<rect x="830" y="335" width="290" height="125" fill="#edf3f5" stroke="#17394b"/>
<text x="844" y="360.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">L - independent permit</text>
<text x="844" y="388.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">MCU + watchdog + manual latch; vendor</text>
<text x="844" y="407.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">suppression interface unresolved</text>
