<text x="70" y="707.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17394b">IF-01/02: vendor raw acquisition and programmable interface. IF-04: host-to-controller status. IF-05: permit to approved adapter only. Solid arrows are</text>
<text x="70" y="727.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17394b">information; dashed line is control. Fluid service is never an electronic teaching bridge.</text>
