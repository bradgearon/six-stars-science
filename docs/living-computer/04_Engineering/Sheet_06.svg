<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842">
<rect width="100%" height="100%" fill="white"/>
<text x="42" y="37.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#087e85">CE-ENG-001 / Sheet 06</text>
<text x="42" y="71.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17394b">Commissioning and release sequence</text>
<text x="42" y="96.66" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#a85418">Tests on drawings/software are not measurements of an assembled board or living cartridge</text>
<line x1="42" y1="112" x2="1148" y2="112" stroke="#17394b" stroke-width="1.5"/>
<rect x="70" y="150" width="300" height="120" fill="#edf3f5" stroke="#17394b"/>
<text x="84" y="175.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">1 - Inspect and power</text>
<text x="84" y="203.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Review netlist and package pinouts. Check</text>
<text x="84" y="222.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">shorts, supply and reset with no instrument</text>
<text x="84" y="241.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">connected.</text>
<rect x="445" y="150" width="300" height="120" fill="#edf3f5" stroke="#17394b"/>
<text x="459" y="175.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">2 - Test permit logic</text>
<text x="459" y="203.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Observe boot, arm, STOP, COVER,</text>
<text x="459" y="222.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">READY loss, missing/stuck DONE and held</text>
<text x="459" y="241.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">ARM.</text>
<rect x="820" y="150" width="300" height="120" fill="#edf3f5" stroke="#17394b"/>
<text x="834" y="175.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">3 - Resolve IF-05</text>
<text x="834" y="203.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Vendor-approved suppression of every</text>
<text x="834" y="222.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">stimulation source. Measure final output</text>
<text x="834" y="241.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">behavior.</text>
<line x1="370" y1="210" x2="445" y2="210" stroke="#087e85" stroke-width="2"/>
<line x1="445" y1="210" x2="435.9955289764732" y2="214.3496553411123" stroke="#087e85" stroke-width="2"/>
<line x1="445" y1="210" x2="435.9955289764732" y2="205.6503446588877" stroke="#087e85" stroke-width="2"/>
<line x1="745" y1="210" x2="820" y2="210" stroke="#087e85" stroke-width="2"/>
<line x1="820" y1="210" x2="810.9955289764732" y2="214.3496553411123" stroke="#087e85" stroke-width="2"/>
<line x1="820" y1="210" x2="810.9955289764732" y2="205.6503446588877" stroke="#087e85" stroke-width="2"/>
<rect x="70" y="390" width="300" height="120" fill="#edf3f5" stroke="#17394b"/>
<text x="84" y="415.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">4 - Qualify the culture</text>
<text x="84" y="443.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">G1 source, G2 maturation and G3</text>
<text x="84" y="462.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">interface. Live profiles and limits must be</text>
<text x="84" y="481.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">released.</text>
<rect x="445" y="390" width="300" height="120" fill="#edf3f5" stroke="#17394b"/>
<text x="459" y="415.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">5 - Train and test C</text>
<text x="459" y="443.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">T03 acquisition, T04 retention, sealed</text>
<text x="459" y="462.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">confirmation and old-task protection.</text>
<rect x="820" y="390" width="300" height="120" fill="#edf3f5" stroke="#17394b"/>
<text x="834" y="415.94" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17394b">6 - Admit a child</text>
<text x="834" y="443.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">Independent O training; shadow, advice,</text>
<text x="834" y="462.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17394b">contribution and separation tests.</text>
<line x1="370" y1="450" x2="445" y2="450" stroke="#087e85" stroke-width="2"/>
<line x1="445" y1="450" x2="435.9955289764732" y2="454.3496553411123" stroke="#087e85" stroke-width="2"/>
<line x1="445" y1="450" x2="435.9955289764732" y2="445.6503446588877" stroke="#087e85" stroke-width="2"/>
<line x1="745" y1="450" x2="820" y2="450" stroke="#087e85" stroke-width="2"/>
<line x1="820" y1="450" x2="810.9955289764732" y2="454.3496553411123" stroke="#087e85" stroke-width="2"/>
<line x1="820" y1="450" x2="810.9955289764732" y2="445.6503446588877" stroke="#087e85" stroke-width="2"/>
<text x="70" y="603.12" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17394b">Fault response: remove task permission and clear the arm latch; continue qualified life support. Correct the cause, requalify the affected path and</text>
<text x="70" y="624.12" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17394b">require manual rearm. A power cycle or restored connection must not replay queued stimulation.</text>
<text x="70" y="702.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17394b">Measured records needed: logic levels, worst observed latency, reset/held-button behavior, final adapter coverage, calibration, culture release, delivered</text>
<text x="70" y="722.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17394b">exposure and preparation-level outcomes. Open owners and closure tests are in readiness_register.json.</text>
<line x1="42" y1="789" x2="1148" y2="789" stroke="#17394b" stroke-width="1.5"/>
<text x="42" y="811.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#17394b">Revision A | 13 Nov 2026 | Reference design - see release register and engineering specification</text>
<text x="1050" y="811.02" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#17394b">6 / 6</text>
</svg>